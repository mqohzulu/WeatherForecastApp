name: china_import_app
description: "China Import & Distribution Platform — branded ordering app (Flutter client for the .NET 8 REST API)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Secure storage (tokens)
  flutter_secure_storage: ^9.2.2

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional error handling (Either / Option)
  fpdart: ^1.1.0

  # Utilities
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

  # Lints
  flutter_lints: ^4.0.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
